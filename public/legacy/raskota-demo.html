<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RasKota - Demo Version</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: one app, three role views (customer phone / kitchen board / owner desk), switched from a sticky brand bar. Single dark look taken from the RasKota menu board. */
:root{
  --ink:#0e0c0a; --panel:#1a1714; --panel2:#24201c; --line:#3a332c;
  --fg:#f7efe3; --muted:#b5a895;
  --amber:#f7a81b; --flame:#ea5a1e; --red:#d3241c;
  --ok:#3fb36a; --warn:#f7a81b; --crit:#e2443a;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --label:'Barlow Condensed','Arial Narrow',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --script:'Permanent Marker','Brush Script MT',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#000}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#000;border-bottom:3px solid var(--amber);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:0;line-height:1}
.logo .ras{font-family:var(--script);font-size:28px;color:var(--fg)}
.logo .kota{font-family:var(--script);font-size:28px;color:var(--amber)}
.demo-tag{font-family:var(--label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:3px}
.roles{margin-left:auto;display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.roles a{font-family:var(--label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px}
.roles a[aria-current="page"]{background:var(--amber);color:#160d00}
@media (max-width:520px){.roles{margin-left:0;width:100%}.roles a{flex:1;text-align:center;padding:7px 6px}}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.view[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.muted{color:var(--muted)}

/* ===== CUSTOMER ===== */
.phone{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hero{display:flex;flex-direction:column;gap:6px}
.hero h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.hero h1 span{color:var(--amber)}
.status-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.dot.closed{background:var(--crit)}

.install{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.install .ic{width:38px;height:38px;border-radius:9px;background:var(--amber);color:#160d00;display:grid;place-items:center;font-family:var(--script);font-size:15px;flex:none}
.install p{margin:0;font-size:13px;line-height:1.3;flex:1;min-width:0}
.btn{border:0;border-radius:8px;padding:10px 16px;font-family:var(--label);font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.primary{background:var(--amber);color:#160d00;border-color:var(--amber)}
.btn.hot{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tracker{background:linear-gradient(160deg,#2a1608,#1a1714 60%);border:1px solid var(--flame);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tracker-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tracker h3{font-family:var(--display);font-weight:400;font-size:22px;text-transform:uppercase}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.step{display:flex;flex-direction:column;gap:5px}
.step i{height:5px;border-radius:3px;background:var(--line)}
.step.on i{background:var(--amber)}
.step span{font-family:var(--label);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.step.on span{color:var(--fg)}
.msg-row{display:flex;gap:8px}
.msg-row input{flex:1;min-width:0}

.loyalty{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stamps{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;flex:1}
.stamp{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:10px;font-family:var(--label);max-width:100%}
.stamp.got{background:var(--amber);border:0}
.stamp.free{border-color:var(--amber);color:var(--amber);font-weight:700}
.loyalty b{font-family:var(--label);letter-spacing:.04em;text-transform:uppercase;font-size:14px;display:block}

.sec-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:4px}
.sec-title h2{font-family:var(--display);font-weight:400;font-size:28px;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.item .n{width:34px;height:34px;border-radius:50%;background:var(--amber);color:#160d00;display:grid;place-items:center;font-family:var(--display);font-size:17px}
.item h3{font-family:var(--label);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.item p{margin:3px 0 0;font-size:13px;color:var(--muted);line-height:1.35}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.price{font-family:var(--display);font-size:20px;background:var(--red);color:#fff;padding:1px 9px;border-radius:4px;transform:skewX(-8deg)}
.price b{display:inline-block;transform:skewX(8deg);font-weight:400}
.item.out{opacity:.5}
.soldout{font-family:var(--label);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--crit)}
.extras-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.extra{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;font-family:var(--label);font-weight:600;font-size:14px}
.extra span:last-child{color:var(--amber)}
.find{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(0,0,0,.92) 35%)}
.cartbar button{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:460px;margin:0 auto;background:var(--amber);color:#160d00;border:0;border-radius:12px;padding:14px 18px;font-family:var(--label);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;text-transform:uppercase;line-height:1.05}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:34px;height:34px;flex:none;font-size:18px;line-height:1}
.opt{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.opt input{accent-color:var(--amber);width:18px;height:18px;flex:none}
.opt .lbl{flex:1;min-width:0;font-size:14px}
.opt .add{font-family:var(--label);font-weight:700;color:var(--amber)}
.grp{display:flex;flex-direction:column;gap:7px}
.grp>span{font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:38px;height:38px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:20px}
.qty b{font-family:var(--display);font-size:22px;min-width:24px;text-align:center}
input[type=text],input[type=tel],textarea,select{width:100%;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
textarea{resize:vertical;min-height:70px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--amber);background:#2b1f0c}
.seg b{font-family:var(--label);font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.seg small{color:var(--muted);font-size:12.5px}
.line{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.line.total{font-family:var(--display);font-size:22px;border-top:1px solid var(--line);padding-top:10px}
.cart-item{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cart-item div{min-width:0}
.cart-item b{font-family:var(--label);font-size:16px;text-transform:uppercase}
.cart-item small{display:block;color:var(--muted);font-size:12.5px}
.err{color:var(--crit);font-size:13px;margin:0}
.pf{background:#f4f5f7;color:#1d2433;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pf .pfh{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.pf .amt{font-size:30px;font-weight:700}
.pf button{background:#fff;border:1px solid #cfd5df;border-radius:8px;padding:12px;text-align:left;font-weight:600;color:#1d2433;font-size:14px}
.pf button:hover{border-color:#1d2433}
.pf small{color:#5a6475}

/* toasts */
.toasts{position:fixed;z-index:60;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:rgba(36,32,28,.97);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.toast .ic{width:32px;height:32px;border-radius:8px;background:var(--amber);color:#160d00;display:grid;place-items:center;font-family:var(--script);font-size:12px;flex:none}
.toast b{display:block;font-size:13px}
.toast span{font-size:13px;color:var(--muted)}

/* ===== KITCHEN ===== */
.k-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.k-top h1{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase}
.k-actions{display:flex;gap:8px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col-h b{font-family:var(--label);font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.count{font-family:var(--display);font-size:18px;background:var(--panel2);border-radius:6px;padding:0 9px}
.empty{color:var(--muted);font-size:13px;padding:14px 6px;text-align:center}
.ticket{background:var(--fg);color:#1b1410;border-radius:6px;padding:11px 12px 12px;display:flex;flex-direction:column;gap:8px;border-left:6px solid var(--ok)}
.ticket.warn{border-left-color:var(--warn)}
.ticket.crit{border-left-color:var(--crit)}
.t-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t-id{font-family:var(--display);font-size:22px}
.t-time{font-family:var(--label);font-weight:700;font-size:15px}
.t-meta{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:#e6dccd;color:#1b1410}
.chip.paid{background:#cfeedb;color:#0f4a25}
.chip.cash{background:#ffe2b0;color:#5b3800}
.chip.del{background:#1b1410;color:var(--amber)}
.t-items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;border-top:1px dashed #b9ab96;padding-top:8px}
.t-items li{font-size:14px;line-height:1.3}
.t-items b{font-family:var(--label);font-size:17px;text-transform:uppercase}
.t-items small{display:block;color:#6a5b48;font-size:12.5px}
.t-items em{font-style:normal;color:var(--red);font-weight:600;font-size:13px}
.t-note{font-size:13px;background:#fff3d6;border-radius:4px;padding:5px 7px}
.t-btns{display:flex;gap:6px}
.t-btns .btn{flex:1;padding:9px 8px;font-size:14px}
.ticket .btn{border-color:#1b1410}
.ticket .btn.ghost{color:#1b1410}

/* ===== OWNER ===== */
.o-wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.o-wrap>header{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:end}
.o-wrap h1{font-family:var(--display);font-weight:400;font-size:32px;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi span{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.kpi small{color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-family:var(--label);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;align-items:end;height:170px;padding-top:18px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 41px,rgba(255,255,255,.05) 41px 42px)}
.bar-c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.bar-c i{display:block;width:100%;max-width:44px;background:var(--amber);border-radius:4px 4px 0 0;min-height:2px}
.bar-c.now i{background:var(--flame)}
.bar-c em{font-style:normal;font-family:var(--label);font-size:12px;color:var(--fg)}
.bar-x{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;font-family:var(--label);font-size:12px;color:var(--muted);text-align:center}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2)}
.split i:first-child{background:var(--amber)}
.split i:last-child{background:#7b6a55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.rank .track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--flame)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.toggle-row:last-child{border:0}
.sw-btn{width:46px;height:26px;border-radius:999px;border:0;background:var(--ok);position:relative;flex:none}
.sw-btn::after{content:"";position:absolute;top:3px;left:23px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.sw-btn[aria-checked="false"]{background:#4a4038}
.sw-btn[aria-checked="false"]::after{left:3px}
.inbox{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.msg{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:14px}
.msg small{color:var(--muted);display:block;font-size:12px}
.roadmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.roadmap{grid-template-columns:1fr}}
.roadmap div{background:var(--panel2);border-radius:10px;padding:12px;font-size:13.5px;min-width:0}
.roadmap b{font-family:var(--label);font-size:15px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;color:var(--amber)}
.roadmap ul{margin:0;padding-left:17px;display:flex;flex-direction:column;gap:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="bar">
  <div class="logo" aria-label="RasKota"><span class="ras">Ras</span><span class="kota">Kota</span></div>
  <span class="demo-tag">Live demo</span>
  <nav class="roles" aria-label="Switch view">
    <a href="#order" data-v="order">Customer</a>
    <a href="#kitchen" data-v="kitchen">Kitchen</a>
    <a href="#owner" data-v="owner">Owner</a>
  </nav>
</div>

<main>
  <section class="view" id="v-order"></section>
  <section class="view" id="v-kitchen"></section>
  <section class="view" id="v-owner"></section>
</main>

<div class="cartbar" id="cartbar" hidden><button id="openCart" type="button"></button></div>
<div id="sheetRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
const MENU=[
 {id:1,name:'Classic RasKota',short:'Classic',price:35,desc:'Atchaar, chips, polony, cheese, vienna'},
 {id:2,name:'Loaded RasKota',short:'Loaded',price:45,variants:[['With cheese griller','Polony, special garlic, cheese, egg, cheese griller'],['With half russian','Polony, special garlic, cheese, egg, half russian']]},
 {id:3,name:'The Crunch Bossa',short:'Crunch Bossa',price:55,desc:'Crumbed chicken burger, polony, special garlic, cheese, egg'},
 {id:4,name:'The RasKota Plug',short:'Plug',price:55,desc:'Full russian, polony, special garlic, cheese, egg'},
 {id:5,name:'The Double Trouble',short:'Double Trouble',price:65,variants:[['Russian & griller','Full russian, cheese griller, polony, special garlic, cheese, egg'],['Chicken burger & griller','Crumbed chicken burger, polony, special garlic, cheese, egg, cheese griller']]},
 {id:6,name:'The Meat Lover',short:'Meat Lover',price:75,desc:'Full russian, cheese griller, bacon, polony, special garlic, cheese, egg'},
 {id:7,name:'The Ultimate RasKota',short:'Ultimate',price:85,desc:'Full russian, cheese griller, crumbed chicken burger, polony, special garlic, cheese, egg'}
];
const EXTRAS=[{id:'egg',name:'Egg',price:6},{id:'cheese',name:'Cheese',price:6},{id:'vienna',name:'Vienna',price:8},{id:'griller',name:'Cheese griller',price:12},{id:'bacon',name:'Bacon',price:15},{id:'russian',name:'Russian',price:25}];
const DELIVERY=20;
const NAMES=['Thabo','Lerato','Sipho','Ayanda','Kagiso','Zanele','Musa','Nandi','Bongani','Precious','Tshepo','Palesa','Lwazi','Neo','Karabo','Mpho','Dineo','Themba'];
const STREETS=['Gauntlet St','Pretoria Rd','Springbok St','Bonaero Dr','Rhodesfield Ave','Pongola Cres'];

const S={orders:[],cart:[],seq:1040,mine:null,open:true,busy:false,soldOut:{},msgs:[],stamps:6,subs:182,custName:'',custPhone:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R'+Math.round(n);
const item=id=>MENU.find(m=>m.id===id);
const lineUnit=l=>item(l.id).price+l.extras.reduce((a,e)=>a+EXTRAS.find(x=>x.id===e).price,0);
const lineTotal=l=>lineUnit(l)*l.qty;
const orderTotal=o=>o.items.reduce((a,l)=>a+lineTotal(l),0)+(o.type==='delivery'?DELIVERY:0);
const mins=d=>Math.max(0,Math.floor((Date.now()-d)/60000));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hhmm=d=>new Date(d).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'});

function randOrder(ago,status){
  const n=1+(Math.random()<.45?1:0)+(Math.random()<.15?1:0), items=[];
  for(let i=0;i<n;i++){const m=pick(MENU);items.push({id:m.id,variant:m.variants?Math.floor(Math.random()*2):null,extras:Math.random()<.3?[pick(EXTRAS).id]:[],qty:Math.random()<.2?2:1})}
  const type=Math.random()<.35?'delivery':'collect';
  return {id:'RK-'+(S.seq++),name:pick(NAMES),phone:'07'+Math.floor(10000000+Math.random()*89999999),items,type,
    address:type==='delivery'?(Math.floor(Math.random()*90)+1)+' '+pick(STREETS):'',pay:Math.random()<.6?'payfast':'cash',
    status,created:Date.now()-ago*60000,note:Math.random()<.15?'Extra atchaar please':'',demo:true};
}
function seed(){
  for(let i=0;i<26;i++){const o=randOrder(30+Math.floor(Math.random()*330),'done');o.paid=true;S.orders.push(o)}
  S.orders.sort((a,b)=>a.created-b.created);
  [['ready',13],['cooking',8],['cooking',5],['new',2],['new',1]].forEach(([s,a])=>{const o=randOrder(a,s);o.paid=o.pay==='payfast';S.orders.push(o)});
  S.msgs=[{from:'Lerato',text:'Are you open on Sunday?',at:Date.now()-55*60000},{from:'Musa',text:'Can I order 10 kotas for Friday lunch at work?',at:Date.now()-20*60000}];
}

/* ---------- toasts ---------- */
function toast(title,body){
  const t=document.createElement('div');t.className='toast';
  t.innerHTML=`<div class="ic">RK</div><div><b>${esc(title)}</b><span>${esc(body)}</span></div>`;
  $('#toasts').prepend(t);setTimeout(()=>t.remove(),4800);
}

/* ---------- routing ---------- */
function route(){
  let v=(location.hash||'#order').slice(1);if(!['order','kitchen','owner'].includes(v))v='order';
  document.querySelectorAll('.roles a').forEach(a=>{if(a.dataset.v===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  ['order','kitchen','owner'].forEach(x=>$('#v-'+x).hidden=x!==v);
  S.view=v;render();
}
window.addEventListener('hashchange',route);

/* ---------- customer ---------- */
const active=()=>S.orders.filter(o=>['new','cooking'].includes(o.status));
const waitMins=()=>Math.max(8,active().length*4+6+(S.busy?10:0));
const STEP={new:0,cooking:1,ready:2,out:2,done:3};

      <div class="tracker-head"><div><div class="eyebrow">Your order ${my.id}</div><h3>${label}</h3>
      <div class="muted" style="font-size:13px">${my.status==='new'||my.status==='cooking'?`${ahead} order${ahead===1?'':'s'} ahead of you · about ${Math.max(4,ahead*4+6)} min`:del?esc(my.address):'11 Gauntlet Street, Rhodesfield'}</div></div>
      <span class="pill num">${R(orderTotal(my))}</span></div>
      <div class="steps">${['Received','Cooking',del?'On the way':'Ready','Done'].map((t,i)=>`<div class="step ${i<=s?'on':''}"><i></i><span>${t}</span></div>`).join('')}</div>
      <div class="msg-row"><input type="text" id="custMsg" placeholder="Message RasKota about this order" aria-label="Message RasKota"><button class="btn sm" id="sendMsg" type="button">Send</button></div>

    <div class="install"><div class="ic">RK</div><p><b>Add RasKota to your home screen</b><br><span class="muted">Order in two taps and get a ping when your kota is ready.</span></p><button class="btn sm" type="button" id="installBtn">Install</button></div>
    <div class="hero">
      <div class="eyebrow">Made fresh to order · Rhodesfield</div>

      <div class="status-row">
        <span class="pill"><i class="dot ${S.open?'':'closed'}"></i>${S.open?'Open now':'Closed'}</span>

    <div class="sec-title"><h2>Menu</h2><span class="muted" style="font-size:13px">Tap to build your kota</span></div>
    <div class="menu">${MENU.map(m=>{const out=S.soldOut[m.id];return `<div class="item ${out?'out':''}">
      <div class="n">${m.id}</div>
      <div style="min-width:0"><h3>${m.name}</h3><p>${m.desc||m.variants.map(v=>v[1]).join(' <b style="color:var(--amber)">or</b> ')}</p></div>
      <div class="right"><span class="price"><b class="num">${R(m.price)}</b></span>${out?'<span class="soldout">Sold out</span>':`<button class="btn sm primary" type="button" data-add="${m.id}" ${S.open?'':'disabled'}>Add</button>`}</div>
    </div>`}).join('')}</div>
    <div class="sec-title"><h2>Extras</h2></div>
    <div class="extras-strip">${EXTRAS.map(e=>`<div class="extra"><span>${e.name}</span><span class="num">${R(e.price)}</span></div>`).join('')}</div>
    <div class="find"><span class="eyebrow">Find us</span><b>11 Gauntlet Street, Rhodesfield</b><span class="muted">Prefer WhatsApp? 071 533 7375 still works. App orders skip the queue.</span></div>
  </div>`;
  const n=S.cart.reduce((a,l)=>a+l.qty,0);
  $('#cartbar').hidden=!(S.view==='order'&&n);
  $('#openCart').innerHTML=`<span>${n} item${n===1?'':'s'} · View order</span><span class="num">${R(S.cart.reduce((a,l)=>a+lineTotal(l),0))}</span>`;

function sheet(html){
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#sheetRoot').querySelector('input,button.btn');f&&f.focus({preventScroll:true});
}
const closeSheet=()=>{$('#sheetRoot').innerHTML=''};

function openItem(id){
  const m=item(id);let qty=1;
  sheet(`<div class="sheet-head"><div><div class="eyebrow">#${m.id} · ${R(m.price)}</div><h2>${m.name}</h2></div><button class="x" data-close aria-label="Close">×</button></div>
   ${m.variants?`<div class="grp"><span>Choose your build</span>${m.variants.map((v,i)=>`<label class="opt"><input type="radio" name="variant" id="var${i}" value="${i}" ${i===0?'checked':''}><span class="lbl"><b>${v[0]}</b><br><span class="muted">${v[1]}</span></span></label>`).join('')}</div>`:`<p class="muted" style="margin:0">${m.desc}</p>`}
   <div class="grp"><span>Add extras</span>${EXTRAS.map(e=>`<label class="opt"><input type="checkbox" id="ex-${e.id}" value="${e.id}" data-ex><span class="lbl">${e.name}</span><span class="add num">+${R(e.price)}</span></label>`).join('')}</div>
   <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
     <div class="qty"><button type="button" id="qm" aria-label="One less">−</button><b class="num" id="qv">1</b><button type="button" id="qp" aria-label="One more">+</button></div>
     <button class="btn primary" type="button" id="addLine">Add <span class="num" id="addAmt">${R(m.price)}</span></button>
   </div>`);
  const calc=()=>{const ex=[...document.querySelectorAll('[data-ex]:checked')].map(x=>x.value);const l={id,extras:ex,qty};$('#addAmt').textContent=R(lineTotal(l));return l};
  $('#sheetRoot .sheet').addEventListener('change',calc);
  $('#qm').onclick=()=>{qty=Math.max(1,qty-1);$('#qv').textContent=qty;calc()};
  $('#qp').onclick=()=>{qty=Math.min(20,qty+1);$('#qv').textContent=qty;calc()};
  $('#addLine').onclick=()=>{const l=calc();const v=document.querySelector('[name=variant]:checked');l.variant=v?+v.value:null;S.cart.push(l);closeSheet();render();toast('Added to your order',`${qty} × ${m.name}`)};
}

function openCart(err){
  const sub=S.cart.reduce((a,l)=>a+lineTotal(l),0);
  const type=S.draftType||'collect', pay=S.draftPay||'payfast';
  sheet(`<div class="sheet-head"><h2>Your order</h2><button class="x" data-close aria-label="Close">×</button></div>
   ${S.cart.map((l,i)=>{const m=item(l.id);return `<div class="cart-item"><div><b>${l.qty} × ${m.short}</b>
     <small>${m.variants?m.variants[l.variant][0]:''}${l.extras.length?(m.variants?' · ':'')+'+ '+l.extras.map(e=>EXTRAS.find(x=>x.id===e).name).join(', '):''}</small></div>
     <div style="text-align:right"><span class="num">${R(lineTotal(l))}</span><br><button class="btn sm ghost" type="button" data-rm="${i}" style="margin-top:4px">Remove</button></div></div>`}).join('')}
   <div class="grp"><span>Collect or deliver</span><div class="seg">
     <label><input type="radio" name="type" id="t-collect" value="collect" ${type==='collect'?'checked':''}><b>Collect</b><small>11 Gauntlet St · ~${waitMins()} min</small></label>
     <label><input type="radio" name="type" id="t-delivery" value="delivery" ${type==='delivery'?'checked':''}><b>Deliver</b><small>Around Rhodesfield · +R20</small></label></div></div>
   <div class="grp" id="addrGrp" ${type==='delivery'?'':'hidden'}><span>Delivery address</span><input type="text" id="addr" placeholder="Street number and name" value="${esc(S.draftAddr||'')}"></div>
   <div class="grp"><span>Your details</span><input type="text" id="cname" placeholder="Name" value="${esc(S.custName)}" autocomplete="name"><input type="tel" id="cphone" placeholder="Cellphone for order updates" value="${esc(S.custPhone)}" autocomplete="tel"></div>
   <div class="grp"><span>Notes for the kitchen</span><input type="text" id="cnote" placeholder="e.g. no atchaar" value="${esc(S.draftNote||'')}"></div>
   <div class="grp"><span>Payment</span><div class="seg">
     <label><input type="radio" name="pay" id="p-pf" value="payfast" ${pay==='payfast'?'checked':''}><b>Pay now</b><small>Card, Instant EFT, SnapScan</small></label>
     <label><input type="radio" name="pay" id="p-cash" value="cash" ${pay==='cash'?'checked':''}><b>Cash</b><small>Pay when you ${type==='delivery'?'receive it':'collect'}</small></label></div></div>
   <div class="line num"><span>Subtotal</span><span>${R(sub)}</span></div>
   ${type==='delivery'?`<div class="line num"><span>Delivery</span><span>${R(DELIVERY)}</span></div>`:''}
   <div class="line total num"><span>Total</span><span>${R(sub+(type==='delivery'?DELIVERY:0))}</span></div>
   ${err?`<p class="err">${err}</p>`:''}
   <button class="btn primary" type="button" id="place" ${S.cart.length?'':'disabled'}>${pay==='payfast'?'Continue to payment':'Place order'}</button>`);
  const keep=()=>{S.draftType=document.querySelector('[name=type]:checked').value;S.draftPay=document.querySelector('[name=pay]:checked').value;S.draftAddr=$('#addr').value;S.custName=$('#cname').value;S.custPhone=$('#cphone').value;S.draftNote=$('#cnote').value};
  document.querySelectorAll('[name=type],[name=pay]').forEach(r=>r.onchange=()=>{keep();openCart()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{keep();S.cart.splice(+b.dataset.rm,1);render();S.cart.length?openCart():closeSheet()});
  $('#place').onclick=()=>{keep();
    if(!S.custName.trim())return openCart('Add your name so the kitchen can call it out.');
    if(!/^0\d{9}$/.test(S.custPhone.replace(/\s/g,'')))return openCart('Enter a 10-digit cellphone number, e.g. 071 533 7375.');
    if(S.draftType==='delivery'&&!S.draftAddr.trim())return openCart('Add a delivery address.');
    S.draftPay==='payfast'?openPayfast():placeOrder(false)};
}

function openPayfast(){
  const tot=S.cart.reduce((a,l)=>a+lineTotal(l),0)+(S.draftType==='delivery'?DELIVERY:0);
  sheet(`<div class="sheet-head"><h2>Secure payment</h2><button class="x" data-close aria-label="Close">×</button></div>
   <div class="pf"><div class="pfh"><span>PayFast checkout</span><span>Demo · no money moves</span></div>
     <small>Paying RasKota</small><div class="amt num">${R(tot)}.00</div>
     <button type="button" data-pay>Card (Visa / Mastercard)</button><button type="button" data-pay>Instant EFT</button><button type="button" data-pay>SnapScan</button>
     <small>In the live build this step runs through Michael's PayFast account and the order only reaches the kitchen once the payment is confirmed.</small></div>`);
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{b.textContent='Processing…';setTimeout(()=>placeOrder(true),900)});
}

function placeOrder(paid){
  const o={id:'RK-'+(S.seq++),name:S.custName.trim(),phone:S.custPhone,items:S.cart.map(l=>({...l})),type:S.draftType||'collect',address:S.draftAddr||'',pay:S.draftPay||'payfast',paid,status:'new',created:Date.now(),note:S.draftNote||''};
  S.orders.push(o);S.mine=o.id;S.cart=[];S.draftNote='';closeSheet();render();
  toast(`Order ${o.id} received`,paid?`Paid ${R(orderTotal(o))}. We'll ping you when it's ready.`:`Pay ${R(orderTotal(o))} cash on ${o.type==='delivery'?'delivery':'collection'}.`);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- kitchen ---------- */
function ticket(o){
  const m=mins(o.created), cls=o.status==='new'||o.status==='cooking'?(m>=15?'crit':m>=10?'warn':''):'';
  const del=o.type==='delivery';
  const btns={new:`<button class="btn primary" data-st="cooking" data-id="${o.id}">Start cooking</button>`,
    cooking:`<button class="btn hot" data-st="ready" data-id="${o.id}">Mark ready</button>`,
    ready:del?`<button class="btn primary" data-st="out" data-id="${o.id}">Out for delivery</button>`:`<button class="btn primary" data-st="done" data-id="${o.id}">Collected</button>`,
    out:`<button class="btn primary" data-st="done" data-id="${o.id}">Delivered</button>`}[o.status];
  return `<article class="ticket ${cls}">
    <div class="t-head"><span class="t-id">${o.id.slice(3)}</span><span class="t-time num">${m} min</span></div>
    <div><b style="font-size:15px">${esc(o.name)}</b>${S.mine===o.id?' <span class="chip">You</span>':''}</div>
    <div class="t-meta"><span class="chip ${del?'del':''}">${del?'Deliver':'Collect'}</span>${o.paid?`<span class="chip paid">Paid ${R(orderTotal(o))}</span>`:`<span class="chip cash">Cash due ${R(orderTotal(o))}</span>`}</div>
    ${del?`<div style="font-size:13px">${esc(o.address)}</div>`:''}
    <ul class="t-items">${o.items.map(l=>{const it=item(l.id);return `<li><b>${l.qty} × ${it.short}</b>${it.variants?`<small>${it.variants[l.variant][0]}</small>`:''}${l.extras.length?`<em>+ ${l.extras.map(e=>EXTRAS.find(x=>x.id===e).name).join(', ')}</em>`:''}</li>`}).join('')}</ul>
    ${o.note?`<div class="t-note">${esc(o.note)}</div>`:''}
    <div class="t-btns">${btns}</div></article>`;
}
function renderKitchen(){
  const cols=[['New','new'],['On the grill','cooking'],['Ready & out','ready']];
  const list=s=>S.orders.filter(o=>s==='ready'?['ready','out'].includes(o.status):o.status===s).sort((a,b)=>a.created-b.created);
  $('#v-kitchen').innerHTML=`<div class="k-top"><div><div class="eyebrow">Kitchen screen · tablet on the truck</div><h1>Order queue</h1></div>
    <div class="k-actions">
      <button class="btn sm ${S.busy?'hot':''}" id="busyBtn" type="button">${S.busy?'Busy mode on (+10 min)':'Busy mode'}</button>
      <button class="btn sm" id="rushBtn" type="button">Simulate a rush</button>
      <button class="btn sm ${S.open?'':'primary'}" id="openBtn" type="button">${S.open?'Pause orders':'Open for orders'}</button>
    </div></div>
    <div class="board">${cols.map(([t,s])=>{const l=list(s);return `<div class="col"><div class="col-h"><b>${t}</b><span class="count num">${l.length}</span></div>${l.length?l.map(ticket).join(''):'<div class="empty">Nothing here</div>'}</div>`}).join('')}</div>`;
}
function setStatus(id,st){
  const o=S.orders.find(x=>x.id===id);if(!o)return;o.status=st;if(st==='done')o.paid=true;
  if(o.id===S.mine){
    const msg={cooking:['Your kota is on the grill','Order '+o.id+' is being made now.'],ready:o.type==='delivery'?['Packed and ready','Order '+o.id+' leaves with the driver shortly.']:['Your kota is ready!','Come collect '+o.id+' at 11 Gauntlet Street.'],out:['On its way','Your driver is heading to '+o.address+'.'],done:['Enjoy!','Thanks for ordering. Stamp added to your kota card.']}[st];
    if(msg)toast(msg[0],msg[1]);if(st==='done')S.stamps=Math.min(9,S.stamps+1);
  }
  render();
}

/* ---------- owner ---------- */
function renderOwner(){
  const today=S.orders.filter(o=>o.status!=='new'||true);
  const rev=today.reduce((a,o)=>a+orderTotal(o),0), n=today.length;
  const pf=today.filter(o=>o.pay==='payfast').reduce((a,o)=>a+orderTotal(o),0);
  const dels=today.filter(o=>o.type==='delivery').length;
  const now=new Date(), hrs=[];
  for(let h=6;h>=0;h--){const st=new Date(now);st.setMinutes(0,0,0);st.setHours(st.getHours()-h);hrs.push(st.getTime())}
  const hv=hrs.map(t=>today.filter(o=>o.created>=t&&o.created<t+3600000).reduce((a,o)=>a+orderTotal(o),0));
  const mx=Math.max(...hv,1);
  const cnt={};today.forEach(o=>o.items.forEach(l=>cnt[l.id]=(cnt[l.id]||0)+l.qty));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5), tmax=top.length?top[0][1]:1;
  const ext={};today.forEach(o=>o.items.forEach(l=>l.extras.forEach(e=>ext[e]=(ext[e]||0)+l.qty)));
  const exTop=Object.entries(ext).sort((a,b)=>b[1]-a[1])[0];
  $('#v-owner').innerHTML=`<div class="o-wrap">
   <header><div><div class="eyebrow">Owner dashboard · today · example data</div><h1>How today is going</h1></div><span class="pill"><i class="dot ${S.open?'':'closed'}"></i>${S.open?'Taking orders':'Paused'}</span></header>
   <div class="kpis">
     <div class="kpi"><span>Takings</span><b class="num">${R(rev)}</b><small>${n} orders</small></div>
     <div class="kpi"><span>Average order</span><b class="num">${R(rev/Math.max(n,1))}</b><small>${exTop?`Top extra: ${EXTRAS.find(e=>e.id===exTop[0]).name}`:'No extras yet'}</small></div>
     <div class="kpi"><span>Paid upfront</span><b class="num">${Math.round(pf/Math.max(rev,1)*100)}%</b><small>${R(pf)} via PayFast</small></div>
     <div class="kpi"><span>Deliveries</span><b class="num">${dels}</b><small>${R(dels*DELIVERY)} in delivery fees</small></div>
   </div>
   <div class="grid2">
     <div class="card"><div class="card-h"><h2>Takings by hour</h2><span class="muted" style="font-size:13px">Plan prep and staff around the peaks</span></div>
       <div class="bars">${hv.map((v,i)=>`<div class="bar-c ${i===6?'now':''}"><em class="num">${v?R(v):''}</em><i style="height:${v/mx*100}%"></i></div>`).join('')}</div>
       <div class="bar-x">${hrs.map((t,i)=>`<span>${i===6?'Now':new Date(t).getHours()+':00'}</span>`).join('')}</div>
       <div class="split" aria-hidden="true"><i style="width:${pf/Math.max(rev,1)*100}%"></i><i style="flex:1"></i></div>
       <div class="legend"><span><i class="sw" style="background:var(--amber)"></i>PayFast <b class="num">${R(pf)}</b></span><span><i class="sw" style="background:#7b6a55"></i>Cash <b class="num">${R(rev-pf)}</b></span></div>
     </div>
     <div class="card"><h2>Best sellers</h2>
       <ol class="rank">${top.map(([id,c])=>`<li><span>${item(+id).name}</span><b class="num">${c}</b><span class="track"><i style="width:${c/tmax*100}%"></i></span></li>`).join('')}</ol></div>
   </div>
   <div class="grid2">
     <div class="card"><div class="card-h"><h2>Send a push to customers</h2><span class="muted num" style="font-size:13px">${S.subs} app users</span></div>
       <textarea id="bcast" aria-label="Message to customers">Lunch special: Classic RasKota + extra cheese for R39 until 2pm. Order in the app.</textarea>
       <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="sendBcast" type="button">Send push</button><button class="btn" id="copyBcast" type="button">Copy for WhatsApp group</button></div>
       <span class="muted" style="font-size:12.5px">Every phone with the app gets it instantly. The copy button gives you the same text for the WhatsApp group.</span></div>
     <div class="card"><h2>Menu availability</h2><div>${MENU.map(m=>`<div class="toggle-row"><span>${m.name}</span><button class="sw-btn" role="switch" aria-checked="${!S.soldOut[m.id]}" data-so="${m.id}" aria-label="${m.name} available"></button></div>`).join('')}</div>
       <span class="muted" style="font-size:12.5px">Switch an item off when you run out of russians and customers see it as sold out.</span></div>
   </div>
   <div class="grid2">
     <div class="card"><h2>Customer messages</h2><div class="inbox">${S.msgs.slice().reverse().map(m=>`<div class="msg"><small>${esc(m.from)}${m.order?' · '+m.order:''} · ${hhmm(m.at)}</small>${esc(m.text)}</div>`).join('')||'<div class="empty">No messages</div>'}</div></div>
     <div class="card"><h2>Customers</h2>
       <div class="toggle-row"><span>App users</span><b class="num">${S.subs}</b></div>
       <div class="toggle-row"><span>WhatsApp group members</span><b class="num">140</b></div>
       <div class="toggle-row"><span>Repeat customers this week</span><b class="num">41</b></div>
       <div class="toggle-row"><span>Free kotas earned (loyalty)</span><b class="num">6</b></div></div>
   </div>
   <div class="card"><h2>What comes next</h2><div class="roadmap">
     <div><b>Live in 2 weeks</b><ul><li>Ordering app on its own web address</li><li>Kitchen screen on a tablet</li><li>PayFast payments</li><li>Ready and delivery notifications</li></ul></div>
     <div><b>Month 2</b><ul><li>Kota card loyalty</li><li>Push specials to customers</li><li>Driver view with map link</li><li>Daily sales summary on WhatsApp</li></ul></div>
     <div><b>Later</b><ul><li>Pre-orders for offices and events</li><li>Stock count for bread, russians, chips</li><li>Simple bookkeeping export</li></ul></div>
   </div></div>
  </div>`;
}

/* ---------- glue ---------- */
function render(){
  if(S.view==='order')renderOrder();
  if(S.view==='kitchen')renderKitchen();
  if(S.view==='owner')renderOwner();
  const n=S.cart.reduce((a,l)=>a+l.qty,0);$('#cartbar').hidden=!(S.view==='order'&&n);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-close]');
  if(e.target.id==='scrim'||(t&&t.hasAttribute('data-close')))return closeSheet();
  if(!t)return;
  if(t.dataset.add)return openItem(+t.dataset.add);
  if(t.id==='openCart')return openCart();
  if(t.dataset.st)return setStatus(t.dataset.id,t.dataset.st);
  if(t.dataset.so){S.soldOut[t.dataset.so]=!S.soldOut[t.dataset.so];render();return}
  switch(t.id){
    case 'installBtn':toast('RasKota installed','It now opens from your home screen like any app.');t.closest('.install').remove();break;
    case 'sendMsg':{const v=$('#custMsg').value.trim();if(!v)return;S.msgs.push({from:S.custName||'You',order:S.mine,text:v,at:Date.now()});$('#custMsg').value='';toast('Message sent','RasKota will reply here.');break}
    case 'busyBtn':S.busy=!S.busy;render();break;
    case 'openBtn':S.open=!S.open;render();break;
    case 'rushBtn':for(let i=0;i<4;i++){const o=randOrder(0,'new');o.created=Date.now()-i*20000;o.paid=o.pay==='payfast';S.orders.push(o)}toast('4 new orders','The queue updates the moment they pay.');render();break;
    case 'sendBcast':{const v=$('#bcast').value.trim();if(!v)return;toast('RasKota',v);setTimeout(()=>toast('Push sent',`Delivered to ${S.subs} phones.`),600);break}
    case 'copyBcast':{const ta=$('#bcast');navigator.clipboard?navigator.clipboard.writeText(ta.value).then(()=>toast('Copied','Paste it into the WhatsApp group.'),()=>{ta.select();toast('Text selected','Copy it and paste into the group.')}):(ta.select());break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
setInterval(()=>{if(S.view==='kitchen')renderKitchen()},20000);
seed();route();
</script>

</body></html>
